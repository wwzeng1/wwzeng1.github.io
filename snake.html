<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }

    .score-bar {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .score-bar span {
      color: #94a3b8;
    }

    .score-bar strong {
      color: #e2e8f0;
    }

    canvas {
      border: 2px solid #1e293b;
      border-radius: 8px;
      background: #111827;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.08);
    }

    .controls-hint {
      margin-top: 1rem;
      color: #64748b;
      font-size: 0.85rem;
    }

    .controls-hint kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: inherit;
      color: #94a3b8;
    }

    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      font-size: 1.6rem;
      color: #f1f5f9;
      margin-bottom: 0.5rem;
    }

    .overlay p {
      color: #94a3b8;
      font-size: 1rem;
    }

    a.back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    a.back-link:hover { color: #e2e8f0; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Home</a>
  <h1>Snake</h1>
  <div class="score-bar">
    <div><span>Score:</span> <strong id="score">0</strong></div>
    <div><span>Best:</span> <strong id="best">0</strong></div>
  </div>
  <div style="position:relative; display:inline-block;">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-msg">Press any arrow key to start</p>
    </div>
  </div>
  <div class="controls-hint">
    <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move
    &middot; <kbd>Space</kbd> to pause
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;
    const BASE_INTERVAL = 120;

    let snake, dir, nextDir, food, score, best, gameState, loopId, lastTime, elapsed;

    best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
    bestEl.textContent = best;

    function init() {
      const mid = Math.floor(ROWS / 2);
      snake = [
        { x: Math.floor(COLS / 2), y: mid },
        { x: Math.floor(COLS / 2) - 1, y: mid },
        { x: Math.floor(COLS / 2) - 2, y: mid },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function showOverlay(title, msg) {
      overlayTitle.textContent = title;
      overlayMsg.textContent = msg;
      overlay.classList.remove('hidden');
      overlay.style.width = canvas.width + 'px';
      overlay.style.height = canvas.height + 'px';
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#1a2234';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const g = Math.round(180 + 75 * ratio);
        ctx.fillStyle = i === 0 ? '#4ade80' : `rgb(34, ${g}, 100)`;
        if (i === 0) {
          ctx.shadowColor = '#4ade80';
          ctx.shadowBlur = 8;
        }
        roundRect(ctx, seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function update() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
      if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snakeBest', best);
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function die() {
      gameState = 'dead';
      showOverlay('Game Over', `Score: ${score}  —  Press arrow key to restart`);
    }

    function loop(ts) {
      loopId = requestAnimationFrame(loop);
      if (!lastTime) lastTime = ts;
      elapsed += ts - lastTime;
      lastTime = ts;

      const speed = Math.max(50, BASE_INTERVAL - score * 2);
      if (elapsed >= speed) {
        elapsed = 0;
        update();
      }
      draw();
    }

    function startGame() {
      init();
      hideOverlay();
      gameState = 'running';
      lastTime = 0;
      elapsed = 0;
      if (loopId) cancelAnimationFrame(loopId);
      loopId = requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space',' '].includes(e.key)) {
        e.preventDefault();
      }

      if (gameState === 'idle' || gameState === 'dead') {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
          startGame();
          if (e.key === 'ArrowUp')    nextDir = { x: 0, y: -1 };
          if (e.key === 'ArrowDown')  nextDir = { x: 0, y: 1 };
          if (e.key === 'ArrowLeft')  nextDir = { x: -1, y: 0 };
          if (e.key === 'ArrowRight') nextDir = { x: 1, y: 0 };
        }
        return;
      }

      if (e.key === ' ' || e.key === 'Space') {
        if (gameState === 'running') {
          gameState = 'paused';
          cancelAnimationFrame(loopId);
          showOverlay('Paused', 'Press Space to resume');
        } else if (gameState === 'paused') {
          gameState = 'running';
          hideOverlay();
          lastTime = 0;
          loopId = requestAnimationFrame(loop);
        }
        return;
      }

      if (e.key === 'ArrowUp'    && dir.y === 0) nextDir = { x: 0, y: -1 };
      if (e.key === 'ArrowDown'  && dir.y === 0) nextDir = { x: 0, y: 1 };
      if (e.key === 'ArrowLeft'  && dir.x === 0) nextDir = { x: -1, y: 0 };
      if (e.key === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
    });

    // Initial state
    gameState = 'idle';
    init();
    draw();
    showOverlay('Snake', 'Press any arrow key to start');
  </script>
</body>
</html>
